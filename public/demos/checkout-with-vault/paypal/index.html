<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Checkout with Vault — PayPal</title>
<link rel="stylesheet" href="/shared/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-highlight/prism-line-highlight.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-highlight/prism-line-highlight.min.js"></script>
<script src="https://js.braintreegateway.com/web/3.140.0/js/client.min.js"></script>
<script src="https://js.braintreegateway.com/web/3.140.0/js/paypal-checkout.min.js"></script>
</head>
<body>

  <!-- ================= TOP BAR ================= -->
  <div class="top-bar">
    <div class="brand">
      <a href="/" style="color:inherit;text-decoration:none;">🧾 Braintree Demo Suite</a>
      <span class="badge">Sandbox</span>
      <span class="badge group-badge">Checkout with Vault</span>
    </div>
    <div class="token-row">
      <span id="cfg-token-display">(loading...)</span>
      <button class="btn-light" id="cfg-copy-btn">Copy</button>
    </div>
    <button class="btn-primary" id="cfg-generate-btn">Generate New Token</button>
    <button class="btn-light" id="cfg-clear-btn">Clear All</button>
  </div>

  <div class="edit-toggle-row">
    <input type="checkbox" id="cfg-edit-toggle">
    <label for="cfg-edit-toggle">Use custom credentials instead of sandbox defaults</label>
  </div>

  <div id="cfg-credentials-fields">
    <label>Environment
      <select id="cfg-environment">
        <option value="sandbox" selected>Sandbox</option>
        <option value="production">Production</option>
      </select>
    </label>
    <label>Merchant ID
      <input type="text" id="cfg-merchant-id" placeholder="e.g. 69jzfyjt6ng6pyxq">
    </label>
    <label>Public Key
      <input type="text" id="cfg-public-key" placeholder="Public key">
    </label>
    <label>Private Key
      <input type="password" id="cfg-private-key" placeholder="Private key">
    </label>
  </div>

  <!-- ================= MAIN SHELL ================= -->
  <div class="demo-shell">

    <!-- FAR LEFT: Live Code Walkthrough (shared component) -->
    <div class="panel code-panel">
      <div class="code-panel-header">
        <h2 style="margin: 0;">Live Code</h2>
        <div class="code-tabs">
          <button class="code-tab active" id="code-tab-client" type="button">app.js</button>
          <button class="code-tab" id="code-tab-server" type="button">server.js</button>
        </div>
      </div>
      <p class="code-panel-filename" id="code-panel-filename">app.js — client</p>
      <div id="code-panel-content"></div>
    </div>


    <!-- LEFT: Diagnostics -->
    <div class="panel">
      <h2>Diagnostics / Response Log</h2>
      <div id="diagnostics-panel"></div>
    </div>

    <!-- RIGHT: Payment form -->
    <div class="panel">
      <div class="payment-method-tabs">
        <a href="/demos/checkout-with-vault/card/">Card</a>
        <a href="/demos/checkout-with-vault/card-3ds/">Card + 3DS</a>
        <a href="/demos/checkout-with-vault/paypal/" class="active">PayPal</a>
      </div>

      <h2>Order Details</h2>
      <div class="field-row">
        <div class="field">
          <label for="order-amount">Amount (USD)</label>
          <input type="text" id="order-amount" value="49.00">
        </div>
        <div class="field">
          <label for="order-desc">Description</label>
          <input type="text" id="order-desc" value="Demo order — Checkout with Vault (PayPal)">
        </div>
      </div>

      <h2>Customer Details</h2>
      <div class="field-row">
        <div class="field">
          <label for="cust-first-name">First Name</label>
          <input type="text" id="cust-first-name" value="Jane">
        </div>
        <div class="field">
          <label for="cust-last-name">Last Name</label>
          <input type="text" id="cust-last-name" value="Doe">
        </div>
      </div>
      <div class="field-row single">
        <div class="field">
          <label for="cust-email">Email</label>
          <input type="email" id="cust-email" value="jane.doe@example.com">
        </div>
      </div>
      <div class="field-row single">
        <div class="field">
          <label for="addr-street">Street Address</label>
          <input type="text" id="addr-street" value="2211 N 1st St">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="addr-city">City</label>
          <input type="text" id="addr-city" value="San Jose">
        </div>
        <div class="field">
          <label for="addr-state">State</label>
          <input type="text" id="addr-state" value="CA">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="addr-zip">ZIP / Postal Code</label>
          <input type="text" id="addr-zip" value="95131">
        </div>
        <div class="field">
          <label for="addr-country">Country Code</label>
          <input type="text" id="addr-country" value="US">
        </div>
      </div>

      <div class="field-row single">
        <div class="field vault-checkbox-row">
          <label>
            <input type="checkbox" id="save-vault-checkbox" checked>
            Save this PayPal account for future use (buyer will see a billing agreement consent screen)
          </label>
        </div>
      </div>

      <h2 style="margin-top: 20px;">Pay with PayPal</h2>
      <p class="paypal-note" id="paypal-note">Waiting for client token...</p>
      <div id="payment-method-mount">
        <div id="paypal-button-container"></div>
      </div>

      <div class="result-banner" id="result-banner"></div>
      <div class="vault-result" id="vault-result"></div>
    </div>

  </div>

  <style>
    .paypal-note {
      font-size: 12px;
      color: var(--color-text-muted);
      margin: 0 0 12px;
    }
    #paypal-button-container {
      max-width: 300px;
    }
    .vault-checkbox-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .vault-checkbox-row input {
      width: 16px;
      height: 16px;
    }
    .vault-result {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      background: #eef4fb;
      border: 1px solid #cfe0f2;
      display: none;
    }
    .vault-result.show { display: block; }
    .vault-result code {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      word-break: break-all;
    }
  
    /* ===== Code Panel layout (shared pattern across pages) ===== */
    body.cwv-paypal-page .demo-shell {
      grid-template-columns: 560px 380px 1fr;
      max-width: 1640px;
    }
    @media (max-width: 1540px) {
      body.cwv-paypal-page .demo-shell { grid-template-columns: 440px 380px 1fr; max-width: 1520px; }
    }
    @media (max-width: 1240px) {
      body.cwv-paypal-page .demo-shell { grid-template-columns: 380px 1fr; }
      .code-panel { display: none; }
    }
    @media (max-width: 900px) {
      body.cwv-paypal-page .demo-shell { grid-template-columns: 1fr; }
    }

    .code-panel {
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 620px;
    }
    .code-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      flex-shrink: 0;
    }
    .code-tabs { display: flex; gap: 4px; }
    .code-tab {
      background: #f0f1f3;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--color-text-muted);
      cursor: pointer;
    }
    .code-tab:hover { background: #e6e7ea; }
    .code-tab.active {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }
    .code-panel-filename {
      font-size: 11px;
      font-family: "SF Mono", Menlo, monospace;
      color: var(--color-text-muted);
      margin: 0 0 10px;
      flex-shrink: 0;
    }
    #code-panel-content {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      border-radius: 8px;
      background: #1a1a2e;
    }
    #code-panel-content pre {
      margin: 0 !important;
      min-height: 100%;
      font-size: 11.5px !important;
      border-radius: 8px !important;
      color: #ccc;
    }
    #code-panel-content code { color: inherit; }
    #code-panel-content .line-highlight {
      background: rgba(0, 112, 186, 0.35) !important;
      background-image: none !important;
    }

  </style>

    <script>
    document.body.classList.add('cwv-paypal-page');
  </script>

  <script src="/shared/diagnostics.js"></script>
  <script src="/shared/config-panel.js"></script>
  <script src="/shared/code-panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
